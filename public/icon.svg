<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Inner Glow/Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#334155" stroke-width="12" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Dial Markers (Hours) -->
  <g stroke="#475569" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="45" x2="256" y2="65" />
    <line x1="256" y1="467" x2="256" y2="447" />
    <line x1="45" y1="256" x2="65" y2="256" />
    <line x1="467" y1="256" x2="447" y2="256" />
  </g>

  <!-- Accent Inner Dial -->
  <circle cx="256" cy="256" r="180" fill="none" class="stroke-primary" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4" />

  <!-- Clock hands -->
  <g stroke-linecap="round">
    <!-- Hour Hand -->
    <line x1="256" y1="256" x2="256" y2="140" stroke="#f1f5f9" stroke-width="12" />
    
    <!-- Minute Hand -->
    <line x1="256" y1="256" x2="350" y2="256" stroke="url(#accent-grad)" stroke-width="8" filter="url(#glow)" />
    
    <!-- Second Hand -->
    <line x1="256" y1="290" x2="256" y2="80" stroke="#ef4444" stroke-width="3" />
  </g>

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="14" fill="#ef4444" />
  <circle cx="256" cy="256" r="6" fill="#f8fafc" />
</svg>
